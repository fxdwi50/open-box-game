<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open The Box Game</title>
  
  <!-- Firebase App & Realtime Database SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 20px; background: #f4f7f6; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1, h2 { text-align: center; color: #2c3e50; }
    
    /* Connection Status */
    #connectionStatus {
      display: none;
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 8px 16px;
      background: #e74c3c;
      color: white;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      z-index: 9999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Grid Kotak */
    .boxes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; margin: 20px 0; }
    .box-card { height: 100px; background: #3498db; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: transform 0.2s, background 0.2s; }
    .box-card:hover { transform: scale(1.05); }
    .box-card.opened { background: #bdc3c7; color: #7f8c8d; cursor: not-allowed; opacity: 0.7; }

    /* Control Panel */
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; justify-content: center; }
    button { padding: 10px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-primary { background: #2ecc71; color: white; }
    .btn-warning { background: #f39c12; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    
    /* Timer Display */
    .timer-display { font-size: 32px; text-align: center; font-weight: bold; color: #e74c3c; margin: 15px 0; }
    
    /* Input Area */
    textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
  </style>
</head>
<body>

  <!-- Indikator Status Koneksi Offline -->
  <div id="connectionStatus">⚠️ Koneksi Terputus... Menyambungkan ulang</div>

  <div class="container">
    <h1>🎁 Open The Box</h1>

    <!-- Admin Input Area -->
    <div id="adminPanel">
      <h3>Input Soal (Fast Mode - 1 Baris 1 Soal):</h3>
      <textarea id="rawQuestionsInput" placeholder="Soal 1&#10;Soal 2&#10;Soal 3"></textarea>
      
      <div class="controls">
        <button class="btn-primary" onclick="setupNewGame()">🎲 Acak & Tebarkan Game Baru</button>
        <button class="btn-warning" onclick="resetBoxesOnly()">🔄 Reset Kotak Saja (Skor Tetap)</button>
        <button class="btn-danger" onclick="resetScoresOnly()">🧹 Reset Skor Tim Saja</button>
      </div>
    </div>

    <!-- Timer -->
    <div class="timer-display" id="timerDisplay">00</div>

    <!-- Papan Kotak -->
    <div class="boxes-grid" id="boxesGrid"></div>
  </div>

  <script>
    // ==========================================
    // 1. FIREBASE INITIALIZATION
    // ==========================================
    const firebaseConfig = {
      // Masukkan konfigurasi Firebase Anda di sini
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const gameRef = db.ref('currentGame');

    // Store lokal untuk menyimpan array soal saat ini
    let currentQuestionsList = [];

    // ==========================================
    // 2. AUDIO FEEDBACK (WEB AUDIO API)
    // ==========================================
    let audioCtx = null;

    function playTickSound() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // ==========================================
    // 3. FEATURE: RANDOMIZE (FISHER-YATES SHUFFLE)
    // ==========================================
    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // ==========================================
    // 4. GAME LOGIC & RESET CONTROLS
    // ==========================================
    function setupNewGame() {
      const rawText = document.getElementById('rawQuestionsInput').value.trim();
      if (!rawText) {
        alert("Silakan masukkan soal terlebih dahulu!");
        return;
      }
      
      const rawArray = rawText.split('\n').filter(q => q.trim() !== '');
      currentQuestionsList = rawArray; // Simpan cache lokal
      
      // Acak urutan soal
      const shuffledQuestions = shuffleArray(rawArray);
      
      const boxesData = shuffledQuestions.map((q, idx) => ({
        id: idx + 1,
        question: q,
        isOpen: false
      }));

      gameRef.child('boxes').set(boxesData);
      gameRef.child('timer').set(10); // set timer default
    }

    // Fitur: Reset Kotak Saja (Skor Tim Tetap Dipertahankan)
    function resetBoxesOnly() {
      if (currentQuestionsList.length === 0) {
        alert("Tidak ada data soal untuk di-reset!");
        return;
      }
      
      // Mengocok ulang soal yang tersimpan tanpa menghapus node 'teams'
      const shuffled = shuffleArray(currentQuestionsList);
      const boxesData = shuffled.map((q, idx) => ({
        id: idx + 1,
        question: q,
        isOpen: false
      }));

      gameRef.child('boxes').set(boxesData);
      alert("Kotak telah diacak ulang! Skor tim tetap tersimpan.");
    }

    // Fitur: Reset Skor Tim Saja
    function resetScoresOnly() {
      if (confirm("Apakah Anda yakin ingin mengosongkan skor semua tim?")) {
        gameRef.child('teams').once('value', (snapshot) => {
          const teams = snapshot.val();
          if (teams) {
            const resetTeams = {};
            Object.keys(teams).forEach((teamKey) => {
              resetTeams[teamKey] = {
                ...teams[teamKey],
                score: 0
              };
            });
            gameRef.child('teams').set(resetTeams);
            alert("Skor semua tim berhasil di-reset!");
          }
        });
      }
    }

    // ==========================================
    // 5. FIREBASE REALTIME LISTENERS & HANDLING
    // ==========================================
    
    // Fitur: Handling Koneksi Terputus
    function monitorFirebaseConnection() {
      const connectedRef = db.ref(".info/connected");
      const statusElement = document.getElementById("connectionStatus");

      connectedRef.on("value", (snap) => {
        if (snap.val() === true) {
          statusElement.style.display = "none";
        } else {
          statusElement.style.display = "block";
        }
      });
    }

    // Listener Timer (dengan Audio Feedback)
    let previousTime = null;
    gameRef.child('timer').on('value', (snap) => {
      const timeLeft = snap.val() || 0;
      document.getElementById('timerDisplay').innerText = timeLeft;
      
      // Bunyi tick hanya jika detik berubah dan tersisa <= 5 detik
      if (timeLeft <= 5 && timeLeft > 0 && timeLeft !== previousTime) {
        playTickSound();
      }
      previousTime = timeLeft;
    });

    // Listener Rendering Kotak Grid
    gameRef.child('boxes').on('value', (snap) => {
      const boxes = snap.val() || [];
      const grid = document.getElementById('boxesGrid');
      grid.innerHTML = '';

      boxes.forEach((box, index) => {
        const card = document.createElement('div');
        card.className = `box-card ${box.isOpen ? 'opened' : ''}`;
        card.innerText = box.isOpen ? '✓' : index + 1;
        
        card.onclick = () => {
          if (!box.isOpen) {
            gameRef.child(`boxes/${index}/isOpen`).set(true);
            alert(`Kotak ${index + 1}: ${box.question}`);
          }
        };
        grid.appendChild(card);
      });
    });

    // Jalankan pemantau koneksi saat pertama kali dimuat
    monitorFirebaseConnection();
  </script>
</body>
</html>
