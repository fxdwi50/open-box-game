<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open The Box - Host Screen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col justify-between select-none">

    <!-- Header & Kontrol Utama -->
    <header class="flex flex-wrap justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-xl mb-4 gap-3">
        <div>
            <h1 class="text-2xl font-black text-amber-400 tracking-wider">OPEN THE BOX</h1>
            <p class="text-xs text-slate-400">
                Mode: <span id="current-mode" class="font-bold text-white">STANDARD</span> | 
                Tim: <span id="current-turn-display" class="font-bold text-amber-400">Tim 1</span> |
                Total Tim: <span id="total-teams-display" class="font-bold text-emerald-400">10</span>
            </p>
        </div>

        <!-- Quick Controls Tim & Mode Presets -->
        <div class="flex flex-wrap gap-2 items-center">
            <!-- Kontrol Cepat Jumlah Tim -->
            <div class="bg-slate-900/80 p-1 rounded-lg border border-slate-700 flex items-center gap-1.5 px-2 text-xs">
                <span class="text-slate-400 font-bold">Tim:</span>
                <button onclick="changeTeamCount(-1)" class="w-6 h-6 bg-slate-700 hover:bg-slate-600 rounded font-bold text-amber-400">-</button>
                <span id="team-count-badge" class="font-extrabold text-white px-1">10</span>
                <button onclick="changeTeamCount(1)" class="w-6 h-6 bg-slate-700 hover:bg-slate-600 rounded font-bold text-amber-400">+</button>
            </div>

            <!-- Device Sync -->
            <div class="bg-slate-900/80 p-1 rounded-lg border border-slate-700 flex gap-1 text-xs">
                <button onclick="setDeviceMode('SYNC')" id="btn-device-sync" class="px-2 py-1 rounded font-bold bg-indigo-600 text-white">📱 Host & Mobile</button>
                <button onclick="setDeviceMode('HOST_ONLY')" id="btn-device-host" class="px-2 py-1 rounded font-bold text-slate-400 hover:text-white">🖥️ Host Only</button>
            </div>

            <!-- Preset Soal -->
            <div class="flex gap-1">
                <button onclick="setupGame('FULL')" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-500 rounded text-xs font-bold">100% Soal</button>
                <button onclick="setupGame('STANDARD')" class="px-2.5 py-1 bg-amber-600 hover:bg-amber-500 rounded text-xs font-bold">Standard</button>
                <button onclick="setupGame('PARTY')" class="px-2.5 py-1 bg-purple-600 hover:bg-purple-500 rounded text-xs font-bold">Party</button>
            </div>

            <!-- Setting Bagian 2 Trigger -->
            <button onclick="openSettingsModal()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs font-bold border border-slate-600 flex items-center gap-1">
                ⚙️ Setting & Input Soal
            </button>
        </div>
    </header>

    <!-- Main Grid Kotak -->
    <main id="boxes-grid" class="grid grid-cols-5 gap-3 my-auto max-w-5xl mx-auto w-full">
        <!-- Generated by JS -->
    </main>

    <!-- Modal Soal & Action -->
    <div id="modal" class="hidden fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-slate-800 p-6 rounded-2xl max-w-lg w-full text-center border border-slate-700 shadow-2xl relative">
            <div id="timer" class="text-5xl font-black text-rose-500 mb-2">60</div>
            <h3 id="modal-box-num" class="text-amber-400 text-sm font-bold uppercase tracking-wider mb-2">Kotak #</h3>
            
            <div id="modal-content" class="text-xl font-semibold mb-3 min-h-[80px] flex items-center justify-center bg-slate-900/50 p-4 rounded-xl border border-slate-700/50"></div>
            
            <!-- Kunci Jawaban -->
            <div id="modal-answer-key" class="hidden mb-4 p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-lg text-amber-300 text-sm font-medium">
                🔑 <strong>Kunci Jawaban:</strong> <span id="answer-key-text">-</span>
            </div>

            <!-- Notifikasi Rebut -->
            <div id="modal-buzz-alert" class="hidden mb-4 p-3 bg-rose-600/30 border border-rose-500 rounded-xl text-rose-300 font-bold animate-pulse text-sm">
                ⚡ <span id="buzz-team-name">TIM 1</span> BERHASIL MEREBUT!
            </div>

            <div id="modal-actions" class="flex flex-wrap gap-2 justify-center">
                <button onclick="processAnswer(true)" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold text-sm">Benar (+Point)</button>
                <button onclick="processAnswer(false)" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 rounded-lg font-bold text-sm">Salah (Denda)</button>
                <button onclick="enableSteal()" id="btn-steal-trigger" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 rounded-lg font-bold text-sm">⚡ Lempar Pertanyaan</button>
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-600 hover:bg-slate-500 rounded-lg font-bold text-sm">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Modal Setting & Textarea Chatbox Soal -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-slate-800 p-6 rounded-2xl max-w-2xl w-full border border-slate-700 shadow-2xl max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h2 class="text-lg font-bold text-amber-400">⚙️ Pengaturan & Fast Input Soal</h2>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
            </div>

            <div class="overflow-y-auto space-y-4 pr-2 flex-1 text-sm">
                <!-- Config Aturan Game -->
                <div class="grid grid-cols-2 gap-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Jumlah Tim Peserta (2-20):</label>
                        <input type="number" id="cfg-team-count" value="10" min="2" max="20" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-amber-400 font-bold text-lg">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Durasi Timer (Detik):</label>
                        <input type="number" id="cfg-timer" value="60" min="15" max="120" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-white font-bold">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Poin Jawaban Benar:</label>
                        <input type="number" id="cfg-points" value="100" step="10" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-white font-bold">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Denda Jawaban Salah:</label>
                        <input type="number" id="cfg-penalty" value="0" step="10" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-white font-bold">
                    </div>
                    <div class="col-span-2 flex items-center gap-2">
                        <input type="checkbox" id="cfg-show-key" checked class="w-4 h-4 text-amber-500 rounded">
                        <label for="cfg-show-key" class="text-xs text-slate-300">Tampilkan Kunci Jawaban di Layar Host</label>
                    </div>
                </div>

                <!-- Fast Chatbox Input Soal -->
                <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-bold text-amber-400">💬 Input Soal Fast Mode (1 Baris = 1 Soal):</label>
                        <span id="detected-count" class="text-xs bg-emerald-600/30 border border-emerald-500/50 text-emerald-300 px-2 py-0.5 rounded font-bold">Terdeteksi: 20 Soal</span>
                    </div>
                    <p class="text-[11px] text-slate-400 mb-2">Format: <code class="text-amber-300">Pertanyaan | Kunci Jawaban</code></p>
                    
                    <textarea id="bulk-questions-input" oninput="updateDetectedCount()" rows="8" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-xs text-white font-mono focus:outline-none focus:border-amber-500" placeholder="Apa ibu kota Indonesia? | Nusantara&#10;Berapa 15 x 12? | 180"></textarea>
                </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-700 flex justify-end gap-2">
                <button onclick="saveSettings()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold text-sm">Simpan & Reset Game</button>
            </div>
        </div>
    </div>

    <!-- Papan Skor Tim -->
    <footer class="bg-slate-800 p-4 rounded-xl mt-4 border border-slate-700">
        <div id="scoreboard" class="flex justify-around overflow-x-auto gap-2 pb-1">
            <!-- Rendered by JS -->
        </div>
        <div class="text-center text-[11px] text-slate-500 mt-2 font-medium">
            © 2026 Xaverius Dwi. All rights reserved.
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSOsd4zlP-JcS6jDgcSeNLkysuLUh6fsg",
            authDomain: "open-box-game.firebaseapp.com",
            databaseURL: "https://open-box-game-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "open-box-game",
            storageBucket: "open-box-game.firebasestorage.app",
            messagingSenderId: "270823181573",
            appId: "1:270823181573:web:9c83bbaf6c759166ce3b6c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Web Audio Synth
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'buzz') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch(e) {}
        }

        let rawQuestions = Array.from({length: 20}, (_, i) => ({
            text: `Pertanyaan contoh nomor ${i + 1}?`,
            answer: `Kunci Jawaban ${i + 1}`
        }));

        let config = { timerDuration: 60, correctPoints: 100, penaltyPoints: 0, teamCount: 10, showKey: true };
        let activeBoxIndex = null;
        let timerInterval = null;
        let currentTurnTeam = 'team_1';
        let answeringTeam = 'team_1';
        let deviceMode = 'SYNC';

        function setupGame(mode = 'STANDARD') {
            let totalInput = rawQuestions.length;
            let boxes = [];
            let soalCount = totalInput;
            
            if(mode === 'STANDARD') soalCount = Math.ceil(totalInput * 0.75);
            if(mode === 'PARTY') soalCount = Math.ceil(totalInput * 0.60);

            for(let i = 0; i < soalCount; i++) {
                boxes.push({ type: 'SOAL', text: rawQuestions[i].text, answer: rawQuestions[i].answer, points: config.correctPoints, isOpened: false });
            }

            while(boxes.length < totalInput) {
                const isBonus = Math.random() > 0.4;
                if(isBonus) {
                    boxes.push({ type: 'BONUS', text: '🎉 Bonus +50 Poin Gratis!', answer: '-', points: 50, isOpened: false });
                } else {
                    boxes.push({ type: 'ZONK', text: '💥 Zonk! Poin -30!', answer: '-', points: -30, isOpened: false });
                }
            }

            boxes = boxes.sort(() => Math.random() - 0.5);

            let teams = {};
            for(let i = 1; i <= config.teamCount; i++) {
                teams[`team_${i}`] = { name: `Tim ${i}`, score: 0 };
            }

            db.ref('game_state').set({
                mode: mode,
                deviceMode: deviceMode,
                boxes: boxes,
                teams: teams,
                activeBox: null,
                timer: config.timerDuration,
                stealActive: false,
                currentTurn: 'team_1',
                answeringTeam: 'team_1',
                config: config
            });
        }

        db.ref('game_state').on('value', snapshot => {
            const data = snapshot.val();
            if(!data) { setupGame(); return; }

            deviceMode = data.deviceMode || 'SYNC';
            currentTurnTeam = data.currentTurn || 'team_1';
            answeringTeam = data.answeringTeam || currentTurnTeam;
            if(data.config) config = data.config;

            document.getElementById('current-mode').innerText = data.mode;
            document.getElementById('team-count-badge').innerText = config.teamCount;
            document.getElementById('total-teams-display').innerText = config.teamCount;
            document.getElementById('current-turn-display').innerText = data.teams[currentTurnTeam]?.name || currentTurnTeam;
            
            document.getElementById('btn-device-sync').className = deviceMode === 'SYNC' ? "px-2 py-1 rounded font-bold bg-indigo-600 text-white" : "px-2 py-1 rounded font-bold text-slate-400 hover:text-white";
            document.getElementById('btn-device-host').className = deviceMode === 'HOST_ONLY' ? "px-2 py-1 rounded font-bold bg-indigo-600 text-white" : "px-2 py-1 rounded font-bold text-slate-400 hover:text-white";

            renderGrid(data.boxes);
            renderScoreboard(data.teams);

            if(data.activeBox !== null && data.activeBox !== undefined) {
                openModal(data.activeBox, data.boxes[data.activeBox], data.timer, data.stealActive, data.teams);
            } else {
                closeModalUI();
            }
        });

        // Kontrol Cepat Jumlah Tim (+ / -) dari Header
        function changeTeamCount(delta) {
            let newCount = config.teamCount + delta;
            if (newCount >= 2 && newCount <= 20) {
                config.teamCount = newCount;
                setupGame();
            }
        }

        function renderGrid(boxes) {
            const grid = document.getElementById('boxes-grid');
            grid.innerHTML = '';
            
            if(boxes.length > 30) grid.className = "grid grid-cols-8 gap-2 my-auto max-w-6xl mx-auto w-full";
            else if(boxes.length > 20) grid.className = "grid grid-cols-6 gap-2.5 my-auto max-w-5xl mx-auto w-full";
            else grid.className = "grid grid-cols-5 gap-3 my-auto max-w-5xl mx-auto w-full";

            boxes.forEach((box, index) => {
                const btn = document.createElement('button');
                btn.className = `h-20 rounded-xl font-extrabold text-xl transition-all shadow-md flex items-center justify-center ${
                    box.isOpened 
                    ? 'bg-slate-800 text-slate-600 border border-slate-700 cursor-not-allowed' 
                    : 'bg-amber-500 hover:bg-amber-400 text-slate-900 border-b-4 border-amber-700 active:translate-y-1'
                }`;
                btn.innerText = box.isOpened ? '✓' : index + 1;
                btn.onclick = () => selectBox(index);
                grid.appendChild(btn);
            });
        }

        function renderScoreboard(teams) {
            const board = document.getElementById('scoreboard');
            board.innerHTML = '';
            Object.keys(teams).forEach(key => {
                const team = teams[key];
                const isCurrent = key === currentTurnTeam;
                const div = document.createElement('div');
                div.className = `p-2 rounded-lg text-center min-w-[85px] border ${isCurrent ? 'bg-amber-500/20 border-amber-500' : 'bg-slate-700 border-slate-600'}`;
                div.innerHTML = `<div class="text-xs ${isCurrent ? 'text-amber-400 font-extrabold' : 'text-slate-400 font-bold'}">${team.name}</div><div class="text-lg font-black text-amber-400">${team.score}</div>`;
                board.appendChild(div);
            });
        }

        function selectBox(index) {
            activeBoxIndex = index;
            answeringTeam = currentTurnTeam;
            db.ref(`game_state/boxes/${index}/isOpened`).set(true);
            db.ref('game_state/activeBox').set(index);
            db.ref('game_state/timer').set(config.timerDuration);
            db.ref('game_state/stealActive').set(false);
            db.ref('game_state/answeringTeam').set(currentTurnTeam);

            clearInterval(timerInterval);
            let timeLeft = config.timerDuration;
            timerInterval = setInterval(() => {
                timeLeft--;
                db.ref('game_state/timer').set(timeLeft);
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    enableSteal();
                }
            }, 1000);
        }

        function openModal(index, box, timerValue, isSteal, teams) {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal-box-num').innerText = `KOTAK NOMOR ${index + 1} (${box.type})`;
            document.getElementById('modal-content').innerText = box.text;
            document.getElementById('timer').innerText = timerValue;

            const keyEl = document.getElementById('modal-answer-key');
            if (config.showKey && box.answer && box.answer !== '-') {
                document.getElementById('answer-key-text').innerText = box.answer;
                keyEl.classList.remove('hidden');
            } else {
                keyEl.classList.add('hidden');
            }

            const alertEl = document.getElementById('modal-buzz-alert');
            if (isSteal && answeringTeam !== currentTurnTeam) {
                document.getElementById('buzz-team-name').innerText = teams[answeringTeam]?.name || answeringTeam;
                alertEl.classList.remove('hidden');
            } else {
                alertEl.classList.add('hidden');
            }
        }

        function processAnswer(isCorrect) {
            clearInterval(timerInterval);
            db.ref(`game_state/teams/${answeringTeam}/score`).get().then(snap => {
                let currentScore = snap.val() || 0;
                let newScore = isCorrect ? currentScore + config.correctPoints : currentScore - config.penaltyPoints;
                db.ref(`game_state/teams/${answeringTeam}/score`).set(newScore);
                playSound(isCorrect ? 'correct' : 'wrong');
                nextTurn();
                closeModal();
            });
        }

        function enableSteal() {
            db.ref('game_state/stealActive').set(true);
            playSound('buzz');
        }

        function nextTurn() {
            let currentNum = parseInt(currentTurnTeam.replace('team_', ''));
            let nextNum = (currentNum % config.teamCount) + 1;
            db.ref('game_state/currentTurn').set(`team_${nextNum}`);
        }

        function setDeviceMode(mode) {
            db.ref('game_state/deviceMode').set(mode);
        }

        function closeModal() {
            clearInterval(timerInterval);
            db.ref('game_state/activeBox').set(null);
            closeModalUI();
        }

        function closeModalUI() {
            document.getElementById('modal').classList.add('hidden');
        }

        function updateDetectedCount() {
            const val = document.getElementById('bulk-questions-input').value.trim();
            const lines = val ? val.split('\n').filter(line => line.trim() !== '') : [];
            document.getElementById('detected-count').innerText = `Terdeteksi: ${lines.length} Soal`;
        }

        function openSettingsModal() {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('cfg-timer').value = config.timerDuration;
            document.getElementById('cfg-points').value = config.correctPoints;
            document.getElementById('cfg-penalty').value = config.penaltyPoints;
            document.getElementById('cfg-team-count').value = config.teamCount;
            document.getElementById('cfg-show-key').checked = config.showKey;

            const textVal = rawQuestions.map(q => q.answer && q.answer !== '-' ? `${q.text} | ${q.answer}` : q.text).join('\n');
            document.getElementById('bulk-questions-input').value = textVal;
            updateDetectedCount();
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            config.timerDuration = parseInt(document.getElementById('cfg-timer').value) || 60;
            config.correctPoints = parseInt(document.getElementById('cfg-points').value) || 100;
            config.penaltyPoints = parseInt(document.getElementById('cfg-penalty').value) || 0;
            config.teamCount = parseInt(document.getElementById('cfg-team-count').value) || 10;
            config.showKey = document.getElementById('cfg-show-key').checked;

            const val = document.getElementById('bulk-questions-input').value.trim();
            const lines = val ? val.split('\n').filter(line => line.trim() !== '') : [];

            if (lines.length === 0) {
                alert("Masukkan minimal 1 soal di kotak teks!");
                return;
            }

            rawQuestions = lines.map(line => {
                const parts = line.split('|');
                return {
                    text: parts[0].trim(),
                    answer: parts[1] ? parts[1].trim() : '-'
                };
            });

            closeSettingsModal();
            setupGame();
            alert(`Game diperbarui dengan ${config.teamCount} tim dan ${lines.length} kotak!`);
        }
    </script>
</body>
</html>
