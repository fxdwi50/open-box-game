<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open The Box - Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 flex flex-col justify-between items-center text-center select-none">

    <div class="w-full max-w-md">
        <h1 class="text-xl font-bold text-amber-400 mb-1">OPEN THE BOX PLAYER</h1>
        <p id="device-mode-info" class="text-xs text-slate-400 mb-4">Mode Perangkat: Mobile Sync</p>
        
        <!-- Pilihan Tim Dinamis -->
        <div class="mb-6">
            <label class="text-xs text-slate-400 block mb-1">Pilih Identitas Tim Anda:</label>
            <select id="team-select" onchange="switchTeam()" class="bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-white font-bold w-full text-center">
                <!-- Auto Generated by JS -->
            </select>
        </div>

        <!-- Timer & Status -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl mb-6">
            <div id="status-text" class="text-sm font-semibold text-slate-400 mb-2">Menunggu Kotak Dibuka...</div>
            <div id="player-timer" class="text-6xl font-black text-rose-500">60</div>
        </div>

        <!-- Tombol Rebut / Buzz -->
        <button id="buzz-btn" onclick="pressBuzz()" disabled class="w-full py-8 bg-slate-700 text-slate-500 rounded-3xl font-black text-3xl shadow-2xl transition-all border-b-8 border-slate-800">
            REBUT!
        </button>
    </div>

    <!-- Papan Skor Pribadi & Copyright -->
    <div class="w-full max-w-md">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-2">
            <span class="text-xs text-slate-400 font-medium">Skor Tim Anda:</span>
            <div id="my-score" class="text-3xl font-extrabold text-amber-400">0</div>
        </div>
        <div class="text-[11px] text-slate-500 font-medium">
            © 2026 Xaverius Dwi. All rights reserved.
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSOsd4zlP-JcS6jDgcSeNLkysuLUh6fsg",
            authDomain: "open-box-game.firebaseapp.com",
            databaseURL: "https://open-box-game-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "open-box-game",
            storageBucket: "open-box-game.firebasestorage.app",
            messagingSenderId: "270823181573",
            appId: "1:270823181573:web:9c83bbaf6c759166ce3b6c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentTeam = 'team_1';
        let totalTeams = 10;

        function updateTeamOptions(count) {
            const select = document.getElementById('team-select');
            if (select.children.length === count) return;
            
            const selectedVal = select.value || 'team_1';
            select.innerHTML = '';
            for(let i = 1; i <= count; i++) {
                const opt = document.createElement('option');
                opt.value = `team_${i}`;
                opt.innerText = `Tim ${i}`;
                select.appendChild(opt);
            }
            select.value = parseInt(selectedVal.replace('team_', '')) <= count ? selectedVal : 'team_1';
            currentTeam = select.value;
        }

        function switchTeam() {
            currentTeam = document.getElementById('team-select').value;
            db.ref(`game_state/teams/${currentTeam}/score`).get().then(snap => {
                if(snap.exists()) document.getElementById('my-score').innerText = snap.val();
            });
        }

        db.ref('game_state').on('value', snapshot => {
            const data = snapshot.val();
            if(!data) return;

            const deviceMode = data.deviceMode || 'SYNC';
            document.getElementById('device-mode-info').innerText = deviceMode === 'HOST_ONLY' 
                ? "Mode Perangkat: Host Only (HP Hanya Monitoring)" 
                : "Mode Perangkat: Host & Mobile Sync";

            if (data.config && data.config.teamCount) {
                totalTeams = data.config.teamCount;
                updateTeamOptions(totalTeams);
            }

            if(data.teams && data.teams[currentTeam]) {
                document.getElementById('my-score').innerText = data.teams[currentTeam].score;
            }

            document.getElementById('player-timer').innerText = data.timer;

            const buzzBtn = document.getElementById('buzz-btn');
            if(data.stealActive && deviceMode === 'SYNC') {
                document.getElementById('status-text').innerText = "⚡ WAKTU HABIS! TEKAN REBUT!";
                buzzBtn.disabled = false;
                buzzBtn.className = "w-full py-8 bg-rose-600 hover:bg-rose-500 text-white rounded-3xl font-black text-3xl shadow-2xl transition-all border-b-8 border-rose-800 active:translate-y-2 cursor-pointer animate-bounce";
            } else if (deviceMode === 'HOST_ONLY') {
                document.getElementById('status-text').innerText = "Mode Host Only Active";
                buzzBtn.disabled = true;
                buzzBtn.className = "w-full py-8 bg-slate-800 text-slate-600 rounded-3xl font-black text-2xl border-b-8 border-slate-900 cursor-not-allowed";
            } else {
                document.getElementById('status-text').innerText = data.activeBox !== null ? "Soal Sedang Berlangsung..." : "Menunggu Kotak Dibuka...";
                buzzBtn.disabled = true;
                buzzBtn.className = "w-full py-8 bg-slate-700 text-slate-500 rounded-3xl font-black text-3xl shadow-2xl border-b-8 border-slate-800 cursor-not-allowed";
            }
        });

        function pressBuzz() {
            db.ref('game_state/stealActive').set(false);
            db.ref('game_state/answeringTeam').set(currentTeam);
            alert(`TIM ${currentTeam.replace('team_', '')} BERHASIL MEREBUT JAWABAN!`);
        }
    </script>
</body>
</html>
